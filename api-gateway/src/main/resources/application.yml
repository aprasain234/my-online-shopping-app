server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: product_route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/products/**
        - id: order_route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/orders/**
